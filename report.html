<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Smart Gym Admin - Reports</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<!-- TOPBAR -->
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
<div class="container-fluid">

<span class="navbar-brand fw-bold">Smart Gym Admin</span>

<div class="d-flex align-items-center gap-2">
<span id="whoami" class="badge text-bg-light border">Not logged in</span>
<button id="btnLogout" class="btn btn-outline-secondary btn-sm d-none">Logout</button>
</div>

</div>
</nav>

<div class="container-fluid">
<div class="row">

<!-- SIDEBAR -->
<aside class="col-12 col-lg-2 border-end sidebar">
<div class="p-3">

<div class="d-flex align-items-center gap-2 mb-3">
<div class="sb-icon" style="background:#2563eb;color:white;">AV</div>
<div>
<div class="fw-bold">Smart Gym</div>
<div class="small text-muted">Admin Panel</div>
</div>
</div>

<div class="sb-title">Menu</div>

<a href="index.html" class="sb-item text-decoration-none">
<span class="sb-icon">▦</span>
Dashboard
</a>

<a href="logs.html" class="sb-item text-decoration-none">
<span class="sb-icon">≡</span>
Visitor Logs
</a>

<a href="report.html" class="sb-item text-decoration-none active">
<span class="sb-icon">👤</span>
Report
</a>

</div>
</aside>

<!-- MAIN -->
<main class="col-12 col-lg-10 p-3 p-lg-4">

    <!-- LOGIN FORM -->
<section id="loginCard" class="login-wrapper">

<div class="login-card">

<h4 class="login-title">Login</h4>

<div class="form-group">
<label>Email</label>
<input id="email" class="form-control"
placeholder="securityguard@company.com">
</div>

<div class="form-group">
<label>Password</label>
<input id="pass" type="password" class="form-control"
placeholder="••••••••">
</div>

<button id="btnLogin" class="login-btn">
Login
</button>

<div id="loginMsg" class="login-msg"></div>

</div>

</section>

<!-- DASHBOARD -->
<section id="dashboard" class="d-none">

<div class="card shadow-sm">
<div class="card-body">

<h5 class="fw-bold mb-3">Daily Reports</h5>

<div class="table-responsive">
<table class="table table-sm align-middle">

<thead class="table-light">
<tr>
<th>Date</th>
<th>File</th>
<th>Action</th>
</tr>
</thead>

<tbody id="reportTable">
<tr><td colspan="3">Loading...</td></tr>
</tbody>

</table>
</div>

</div>
</div>

</section>

</main>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
