<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smart Gym Admin</title>

  <!-- Bootstrap 5 (Light mode) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your CSS -->
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script> 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

 <!-- TOPBAR -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">Smart Gym Admin</span>

      <div class="d-flex align-items-center gap-2">
        <span id="whoami" class="badge text-bg-light border">Not logged in</span>
        <button id="btnLogout" class="btn btn-outline-secondary btn-sm d-none">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">

      <!-- SIDEBAR -->
      <aside class="col-12 col-lg-2 border-end sidebar">
        <div class="p-3">
          <div class="d-flex align-items-center gap-2 mb-3">
            <div class="sb-icon" style="background:#2563eb;color:white;">AV</div>
            <div>
              <div class="fw-bold">Smart Gym</div>
              <div class="small text-muted">Admin Panel</div>
            </div>
          </div>

          <div class="sb-title">Menu</div>

          <!-- Dashboard -->
          <a href="index.html" class="sb-item flex-grow-1 text-decoration-none">
            <span class="sb-icon">▦</span>
            Dashboard
          </a>

          <!-- Visitor Logs (current page) -->
          <a href="logs.html" class="sb-item flex-grow-1 text-decoration-none active">
            <span class="sb-icon">≡</span>
            Visitor Logs
          </a>

          

          <a href="report.html" class="sb-item text-decoration-none">
            <span class="sb-icon">👤</span>
            Report
          </a>

          <div class="collapse" id="visitorMenu">
            <div class="sb-sub">
              <button type="button" id="jumpCreateVisitor">View Reports</button>
              
            </div>
          </div>

          

          <div class="sb-title">Support</div>

          

          

        

        </div>
      </aside>

      <!-- MAIN -->
      <main class="col-12 col-lg-10 p-3 p-lg-4">

        <!-- LOGIN CARD -->
        <section id="loginCard" class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Guard Login</h5>

            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label class="form-label">Email</label>
                <input id="email" class="form-control" placeholder="securityguard@..." />
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Password</label>
                <input id="pass" type="password" class="form-control" placeholder="••••••••" />
              </div>
            </div>

            <div class="d-flex align-items-center gap-2 mt-3">
              <button id="btnLogin" class="btn btn-primary">Login</button>
              <span id="loginMsg" class="text-danger small"></span>
            </div>
          </div>
        </section>

        <!-- DASHBOARD (HIDE UNTIL LOGIN) -->
        <section id="dashboard" class="d-none">

          <!-- VISITOR CREATE + ASSIGN -->
          <div class="row g-3 mb-3">

            <!-- Create Visitor -->
            <div class="col-12 col-xl-6">
              <div class="card shadow-sm" id="cardCreateVisitor">
                <div class="card-body">
                  <h6 class="fw-bold mb-2">Assign Visitor</h6>

                  <div class="row g-2">
                    <div class="col-12 col-md-7">
                      <input id="vName" class="form-control" placeholder="Visitor name (contoh: Mizan)">
                    </div>
                    <div class="col-12 col-md-5">
                      <input id="vDuration" type="number" class="form-control" value="60" min="1" placeholder="minutes">
                    </div>
                  </div>

                  <div class="d-flex align-items-center gap-2 mt-2">
                    <button id="btnCreateVisitor" class="btn btn-outline-primary btn-sm">Create Visitor</button>
                    <span id="visitorMsg" class="small text-success"></span>
                  </div>

                  <div class="mt-3">
                    <label class="form-label small text-muted">Visitor ID (auto lepas create)</label>
                    <input id="visitorId" class="form-control" readonly placeholder="v_xxx">
                  </div>
                </div>
              </div>
            </div>

            <!-- Assign UID -->
            <div class="col-12 col-xl-6">
              <div class="card shadow-sm" id="cardAssignUid">
                <div class="card-body">
                  <h6 class="fw-bold mb-2">Assign UID to Visitor</h6>

                  <div class="row g-2">
                    <div class="col-12">
                      <input id="uid" class="form-control" placeholder="RFID UID contoh: F9:48:7E:11">
                    </div>
                  </div>

                  <div class="d-flex align-items-center gap-2 mt-2">
                    <button id="btnAssign" class="btn btn-outline-secondary btn-sm">Assign UID</button>
                    <span id="assignMsg" class="small text-success"></span>
                  </div>

                  <div class="small text-muted mt-2">
                    Note: Assign akan update <code>access_index/{UID}</code> ikut visitor yang baru create.
                  </div>
                </div>
              </div>
            </div>

          </div>

          <!-- VISITOR LIST TABLE -->
          <div class="card shadow-sm" id="cardVisitorTable">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="fw-bold m-0">Visitor List</h6>
                <input id="searchVisitor" class="form-control form-control-sm w-auto" placeholder="Search..." />
              </div>

              <div class="table-responsive">
                <table class="table table-sm align-middle">
                  <thead class="table-light">
                    <tr>
                      <th>Created</th>
                      <th>Visitor ID</th>
                      <th>Name</th>
                      
                    </tr>
                  </thead>
                  <tbody id="visitorRows"></tbody>
                </table>
              </div>
            </div>
          </div>

        </section>

      </main>
    </div>
  </div>

  <!-- Bootstrap JS (for collapse) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your JS -->
  <script type="module" src="app.js"></script>
</body>
</html>
