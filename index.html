<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Smart Gym Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- TOPBAR -->
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
<div class="container-fluid">

<span class="navbar-brand fw-bold">Smart Gym Admin</span>

<div class="d-flex align-items-center gap-2">
<span id="whoami" class="badge text-bg-light border">Not logged in</span>
<button id="btnLogout" class="btn btn-outline-secondary btn-sm d-none">Logout</button>
</div>

</div>
</nav>


<div class="container-fluid">
<div class="row">


<!-- SIDEBAR -->
<aside class="col-12 col-lg-2 border-end sidebar">

<div class="p-3">

<div class="d-flex align-items-center gap-2 mb-3">
<div class="sb-icon" style="background:#2563eb;color:white;">AV</div>

<div>
<div class="fw-bold">Smart Gym</div>
<div class="small text-muted">Admin Panel</div>
</div>
</div>

<div class="sb-title">Menu</div>

<a href="index.html" class="sb-item text-decoration-none active">
<span class="sb-icon">▦</span>
Dashboard
</a>

<a href="logs.html" class="sb-item text-decoration-none">
<span class="sb-icon">≡</span>
Visitor Logs
</a>

<a href="report.html" class="sb-item text-decoration-none">
<span class="sb-icon">👤</span>
Report
</a>

<div class="collapse" id="visitorMenu">
<div class="sb-sub">

<button type="button" id="jumpCreateVisitor">
View Reports
</button>

</div>
</div>



</div>
</aside>



<!-- MAIN -->
<main class="col-12 col-lg-10 p-3 p-lg-4">



<!-- LOGIN FORM -->
<section id="loginCard" class="login-wrapper">

<div class="login-card">

<h4 class="login-title">Login</h4>

<div class="form-group">
<label>Email</label>
<input id="email" class="form-control"
placeholder="securityguard@company.com">
</div>

<div class="form-group">
<label>Password</label>
<input id="pass" type="password" class="form-control"
placeholder="••••••••">
</div>

<button id="btnLogin" class="login-btn">
Login
</button>

<div id="loginMsg" class="login-msg"></div>

</div>

</section>



<!-- DASHBOARD -->
<section id="dashboard" class="d-none">



<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">

<div>
<h5 class="m-0 fw-bold">Dashboard</h5>
<div class="text-muted small">Tap logs & visitor management</div>
</div>

<div class="d-flex gap-2">

<button id="btnClearAllLogs" class="btn btn-danger btn-sm">
Clear ALL Tap Logs
</button>

<button id="btnGenerateReport" class="btn btn-outline-primary btn-sm">
Generate Report
</button>

<button id="btnClearResidentLogs" class="btn btn-outline-danger btn-sm">
Clear Resident Only
</button>

<button id="btnClearVisitorLogs" class="btn btn-outline-danger btn-sm">
Clear Visitor Only
</button>

<span id="clearMsg" class="small text-muted align-self-center"></span>

</div>

</div>



<!-- STAT CARDS -->
<div class="row g-3 mb-3">

<div class="col-md-4">
<div class="card shadow-sm">
<div class="card-body">

<div class="text-muted small">Allowed (today)</div>
<div id="statAllow" class="display-6 fw-bold">0</div>

</div>
</div>
</div>


<div class="col-md-4">
<div class="card shadow-sm">
<div class="card-body">

<div class="text-muted small">Denied (today)</div>
<div id="statDeny" class="display-6 fw-bold">0</div>

</div>
</div>
</div>


<div class="col-md-4">
<div class="card shadow-sm">
<div class="card-body">

<div class="text-muted small">Active Visitors</div>
<div id="statVisitors" class="display-6 fw-bold">0</div>

</div>
</div>
</div>

</div>



<!-- TABLES -->
<div class="row g-3">

<!-- RESIDENT -->
<div class="col-xl-6">

<div class="card shadow-sm">
<div class="card-body">

<div class="d-flex justify-content-between mb-2">

<h6 class="fw-bold m-0">Resident Tap Logs</h6>

<input id="searchResident"
class="form-control form-control-sm w-auto"
placeholder="Search...">

</div>

<div class="table-responsive">

<table class="table table-sm">

<thead class="table-light">
<tr>
<th>Time</th>
<th>UID</th>
<th>Name</th>
</tr>
</thead>

<tbody id="residentRows"></tbody>

</table>

</div>

</div>
</div>

</div>



<!-- VISITOR -->
<div class="col-xl-6">

<div class="card shadow-sm">
<div class="card-body">

<div class="d-flex justify-content-between mb-2">

<h6 class="fw-bold m-0">Visitor Tap Logs</h6>

<input id="searchVisitor"
class="form-control form-control-sm w-auto"
placeholder="Search...">

</div>

<div class="table-responsive">

<table class="table table-sm">

<thead class="table-light">
<tr>
<th>Time</th>
<th>UID</th>
<th>Name</th>
</tr>
</thead>

<tbody id="visitorRows"></tbody>

</table>

</div>

</div>
</div>

</div>

</div>



</section>


</main>
</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="app.js"></script>

</body>
</html>
